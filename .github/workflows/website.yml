name: Update bibliography and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Monday 04:17 UTC. Scheduled Actions are best-effort.
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: academic-site-publish
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate bibliography and SFTP deployment
        run: python3 -m unittest discover -s tests -v
      - name: Refresh publications from OpenAIRE
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/sync_openaire.py
      - name: Commit refreshed bibliography if changed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- site/data/publications.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/publications.json
            git commit -m 'chore: synchronize academic publications'
            git push origin HEAD:main
          else
            echo 'No bibliography changes.'
          fi
      # SFTP only (port 22), with pinned SSH host keys; no plaintext FTP fallback.
      # Must opt in explicitly using repository variable DEPLOY_ENABLED=true.
      - name: Install SFTP client
        if: vars.DEPLOY_ENABLED == 'true'
        run: python3 -m pip install 'paramiko>=3.5,<5'
      - name: Deploy site via SFTP (opt-in; dry-run by default)
        if: vars.DEPLOY_ENABLED == 'true'
        env:
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR || '/home/mario.barbareschi/_academic-preview/' }}
          DEPLOY_DRY_RUN: ${{ vars.DEPLOY_DRY_RUN || 'true' }}
        run: python3 scripts/deploy_sftp.py
