name: Explore OpenAIRE publications (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Download OpenAIRE data for review
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query OpenAIRE by ORCID and by author name
        run: python3 scripts/export_openaire.py --output openaire-export
      - name: Print results summary
        if: success()
        run: cat openaire-export/RIEPILOGO.md
      - name: Attach downloadable CSV and JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenAIRE-Mario-Barbareschi
          path: openaire-export/
          if-no-files-found: warn
          retention-days: 30
